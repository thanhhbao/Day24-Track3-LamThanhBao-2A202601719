models:
  - type: main
    engine: openai
    model: deepseek-chat
    parameters:
      base_url: https://api.deepseek.com

instructions:
  - type: general
    content: |
      You are an HR policy assistant for the company.
      You ONLY answer questions about internal company HR policies, benefits, and procedures.
      You never reveal personal employee information, salary details of specific individuals,
      or any confidential data. If a question is outside your scope, politely decline.

# Colang dialogue flows are defined in rails.co. These are plain dialog flows
# ("user ask X" / "bot refuse X") rather than action-based checks, so they are
# NOT registered under `rails: input/output:` — that mechanism expects boolean
# check actions and skips LLM-based intent classification entirely (observed:
# 0 LLM calls, flow stuck on Listen). Letting normal generate_async dialog
# processing classify intent against these canonical forms works correctly.
